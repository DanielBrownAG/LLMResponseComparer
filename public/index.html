<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Response Comparer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-white text-gray-900">
  <!-- Header -->
  <header class="border-b border-gray-200 bg-white">
    <div class="max-w-7xl mx-auto px-6 py-8">
      <h1 class="text-4xl font-bold tracking-tight">LLM Response Comparer</h1>
      <p class="text-gray-600 mt-2">Compare outputs across models instantly</p>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-6 py-8">
    <!-- Input Section -->
    <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-8 mb-8">
      <label for="prompt" class="block text-sm font-semibold text-gray-700 mb-3">
        Enter your prompt
      </label>
      <textarea
        id="prompt"
        placeholder="What would you like to compare? Enter your question or prompt here..."
        rows="5"
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent font-mono text-sm resize-none"
      ></textarea>

      <!-- Model Selection -->
      <div class="grid grid-cols-2 gap-6 mt-6 mb-6">
        <div>
          <label for="leftModel" class="block text-sm font-semibold text-gray-700 mb-2">
            Left Model
          </label>
          <select
            id="leftModel"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="">Select model...</option>
          </select>
        </div>
        <div>
          <label for="rightModel" class="block text-sm font-semibold text-gray-700 mb-2">
            Right Model
          </label>
          <select
            id="rightModel"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="">Select model...</option>
          </select>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-3">
        <button
          id="compareBtn"
          class="px-6 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Compare
        </button>
        <button
          id="clearBtn"
          class="px-6 py-2 border border-gray-300 text-gray-700 font-semibold rounded-lg hover:bg-gray-50 transition"
        >
          Clear
        </button>
      </div>
    </div>

    <!-- Results Section -->
    <div id="resultsSection" class="hidden">
      <div class="flex flex-wrap items-center gap-3 mb-4" aria-label="Comparison actions">
        <button id="saveComparisonBtn" disabled class="px-4 py-2 bg-blue-600 text-white rounded-lg disabled:opacity-50">Save comparison</button>
        <button id="exportJsonBtn" disabled class="px-4 py-2 border rounded-lg disabled:opacity-50">Export JSON</button>
        <button id="exportMarkdownBtn" disabled class="px-4 py-2 border rounded-lg disabled:opacity-50">Export Markdown</button>
      </div>
      <div class="grid grid-cols-2 gap-6">
        <!-- Left Column -->
        <div class="rounded-lg border border-gray-200 shadow-sm overflow-hidden bg-white flex flex-col">
          <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
            <h3 id="leftModelTitle" class="font-semibold text-gray-900"></h3>
          </div>

          <div class="flex-1 overflow-y-auto min-h-96 max-h-96">
            <div id="leftContent" class="px-6 py-4 font-mono text-sm leading-relaxed text-gray-800 whitespace-pre-wrap">
              <span class="animate-pulse">Loading...</span>
            </div>
          </div>

          <div class="bg-gray-50 px-6 py-3 border-t border-gray-200">
            <div class="flex justify-between text-xs text-gray-600 mb-2">
              <span id="leftTokens">Tokens: --</span>
              <span id="leftTime">Time: --ms</span>
            </div>
            <button
              onclick="copyToClipboard('leftContent')"
              class="w-full py-1 text-xs font-medium text-gray-700 hover:bg-gray-100 rounded transition"
            >
              Copy
            </button>
          </div>
        </div>

        <!-- Right Column -->
        <div class="rounded-lg border border-gray-200 shadow-sm overflow-hidden bg-white flex flex-col">
          <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
            <h3 id="rightModelTitle" class="font-semibold text-gray-900"></h3>
          </div>

          <div class="flex-1 overflow-y-auto min-h-96 max-h-96">
            <div id="rightContent" class="px-6 py-4 font-mono text-sm leading-relaxed text-gray-800 whitespace-pre-wrap">
              <span class="animate-pulse">Loading...</span>
            </div>
          </div>

          <div class="bg-gray-50 px-6 py-3 border-t border-gray-200">
            <div class="flex justify-between text-xs text-gray-600 mb-2">
              <span id="rightTokens">Tokens: --</span>
              <span id="rightTime">Time: --ms</span>
            </div>
            <button
              onclick="copyToClipboard('rightContent')"
              class="w-full py-1 text-xs font-medium text-gray-700 hover:bg-gray-100 rounded transition"
            >
              Copy
            </button>
          </div>
        </div>
      </div>
    </div>

    <section class="mt-8 border border-gray-200 rounded-lg p-6" aria-labelledby="savedTitle">
      <h2 id="savedTitle" class="text-xl font-semibold">Saved comparisons</h2>
      <p class="text-sm text-gray-600 mt-2">Saved only in this browser. Save up to 100 comparisons; exports include prompts, responses, models, and metrics.</p>
      <p id="savedMessage" role="status" class="text-sm text-gray-600 mt-3"></p>
      <ul id="savedComparisons" class="space-y-4 mt-4"></ul>
    </section>

    <!-- Error Section -->
    <div id="errorSection" class="hidden bg-red-50 border border-red-200 rounded-lg p-6">
      <p id="errorMessage" class="text-red-800"></p>
    </div>
  </main>

  <!-- Loading Indicator -->
  <div id="loadingOverlay" role="status" aria-live="polite" class="fixed bottom-4 left-4 pointer-events-none hidden">
    <div class="bg-white rounded-lg p-8 shadow-lg">
      <div class="flex items-center gap-3">
        <div class="w-6 h-6 border-3 border-gray-200 border-t-blue-600 rounded-full animate-spin"></div>
        <span class="font-semibold text-gray-700">Comparing responses...</span>
      </div>
    </div>
  </div>

  <script src="/js/comparisons.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
